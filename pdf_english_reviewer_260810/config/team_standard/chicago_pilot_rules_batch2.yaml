version: 2
source_standard: Chicago Manual of Style
source_edition: "18"
rules:
  - rule_key: remove_space_before_question_or_exclamation_mark
    display_name: Remove spaces before question marks and exclamation points
    category: punctuation
    severity: suggestion
    enabled: true
    initial_enabled: true
    matcher_type: regex
    matcher_status: implemented
    source_standard: Chicago Manual of Style
    source_edition: 18
    source_section: "6.127, 6.129"
    source_status: official_qanda_verified
    source_role: supporting
    description: In English technical prose, do not insert a space before a question mark or exclamation point.
    message: Remove the space before the question mark or exclamation point.
    suggestion: Close the space before the punctuation mark.
    positive_examples:
      - "Is the controller ready ?"
      - "Stop the pump immediately !"
      - "Does the value appear on the display\n ?"
    negative_examples:
      - "Is the controller ready?"
      - "Stop the pump immediately!"
      - "Does the value appear on the display?"
    exception_examples:
      - "?status=ready appears only in code examples."
      - "Do not edit the literal value ' ? ' in the parser test."
    exceptions: ["code examples", "literal strings", "URLs and query strings"]
    pilot_batch: 2
    pilot_risk: low

  - rule_key: use_comma_before_coordinating_conjunction_between_independent_clauses
    display_name: Add a comma before a coordinating conjunction between independent clauses
    category: punctuation
    severity: suggestion
    enabled: false
    initial_enabled: false
    matcher_type: contextual
    matcher_status: implemented
    source_standard: Chicago Manual of Style
    source_edition: 18
    source_section: "6.22"
    source_status: official_cmos_verified
    source_role: supporting
    description: Use a comma before and, but, or, nor, for, so, or yet when the conjunction joins two independent clauses.
    message: This coordinating conjunction may join two independent clauses and may need a comma before it.
    suggestion: Insert a comma before the coordinating conjunction if both sides are independent clauses.
    positive_examples:
      - "The scan is complete and the report opens."
      - "The motor stops but the alarm remains active."
      - "The controller responds\nand the status light turns green."
    negative_examples:
      - "The scan is complete, and the report opens."
      - "The motor stops, but the alarm remains active."
      - "Open the cover and remove the cartridge."
    exception_examples:
      - "The board is clean and dry."
      - "The device starts and records data."
    exceptions: ["compound predicates", "short coordinated phrases", "headings and fragments"]
    pilot_batch: 2
    pilot_risk: medium

  - rule_key: avoid_comma_between_compound_predicate_verbs
    display_name: Do not place a comma between compound predicate verbs
    category: punctuation
    severity: suggestion
    enabled: true
    initial_enabled: true
    matcher_type: token
    matcher_status: implemented
    source_standard: Chicago Manual of Style
    source_edition: 18
    source_section: "6.24"
    source_status: official_cmos_verified
    source_role: supporting
    description: Do not separate two verbs sharing the same subject with a comma before and unless the comma prevents ambiguity.
    message: Remove the comma between compound predicate verbs.
    suggestion: Remove the comma before and.
    positive_examples:
      - "Open the cover, and remove the cartridge."
      - "Select the file, and save the report."
      - "Connect the cable,\nand start the controller."
    negative_examples:
      - "Open the cover and remove the cartridge."
      - "Select the file and save the report."
      - "Connect the cable and start the controller."
    exception_examples:
      - "Open the cover, and the cartridge becomes visible."
      - "Press Start, and wait until the LED turns green."
    exceptions: ["independent clauses", "intentional pause for contrast", "quoted source text"]
    pilot_batch: 2
    pilot_risk: low

  - rule_key: use_comma_between_coordinate_adjectives
    display_name: Use a comma between coordinate adjectives
    category: punctuation
    severity: suggestion
    enabled: false
    initial_enabled: false
    matcher_type: token
    matcher_status: implemented
    source_standard: Chicago Manual of Style
    source_edition: 18
    source_section: "5.95, 6.39"
    source_status: official_cmos_verified
    source_role: supporting
    description: Separate coordinate adjectives before a noun with a comma when each adjective independently modifies the noun.
    message: These coordinate adjectives may need a comma between them.
    suggestion: Add a comma between the coordinate adjectives.
    positive_examples:
      - "Use a clean dry cloth."
      - "Insert the tool through the long narrow slot."
      - "The screen shows a clear accurate reading."
    negative_examples:
      - "Use a clean, dry cloth."
      - "Insert the tool through the long, narrow slot."
      - "The screen shows a clear, accurate reading."
    exception_examples:
      - "Install the small circuit board."
      - "Select the green status icon."
    exceptions: ["noncoordinate adjective pairs", "proper names", "approved product terms"]
    pilot_batch: 2
    pilot_risk: medium

  - rule_key: use_period_for_indirect_questions
    display_name: Use a period for indirect questions
    category: punctuation
    severity: suggestion
    enabled: true
    initial_enabled: true
    matcher_type: regex
    matcher_status: implemented
    source_standard: Chicago Manual of Style
    source_edition: 18
    source_section: "6.72-6.74"
    source_status: official_cmos_verified
    source_role: supporting
    description: End an indirect question with a period, not a question mark.
    message: This indirect question should end with a period.
    suggestion: Replace the question mark with a period.
    positive_examples:
      - "Confirm whether the device is ready?"
      - "Check if the firmware is current?"
      - "Verify whether the cable is connected\n?"
    negative_examples:
      - "Confirm whether the device is ready."
      - "Check if the firmware is current."
      - "Is the device ready?"
    exception_examples:
      - "Can you confirm whether the device is ready?"
      - "Is the firmware current?"
    exceptions: ["direct questions", "quoted questions", "UI labels that intentionally end with a question mark"]
    pilot_batch: 2
    pilot_risk: low

  - rule_key: use_percent_symbol_in_technical_measurements
    display_name: Use the percent symbol for technical percentages
    category: numbers_abbreviations
    severity: suggestion
    enabled: true
    initial_enabled: true
    matcher_type: regex
    matcher_status: implemented
    source_standard: Chicago Manual of Style
    source_edition: 18
    source_section: "9.20"
    source_status: official_qanda_verified
    source_role: supporting
    description: In technical measurements and statistical values, use numerals with the percent symbol.
    message: Use the percent symbol for this technical percentage.
    suggestion: Replace percent with %.
    positive_examples:
      - "Set the humidity limit to 45 percent."
      - "The battery charge must be above 20 percent before update."
      - "If the value exceeds 95 percent\nstop the test."
    negative_examples:
      - "Set the humidity limit to 45%."
      - "The battery charge must be above 20% before update."
      - "The report describes a large percentage of failures."
    exception_examples:
      - "The Percent column appears in the exported table."
      - "Write the word percent in quoted marketing text."
    exceptions: ["nontechnical prose", "literal UI labels", "quoted text"]
    pilot_batch: 2
    pilot_risk: low

  - rule_key: use_lowercase_periods_for_am_pm
    display_name: Use lowercase a.m. and p.m.
    category: numbers_abbreviations
    severity: suggestion
    enabled: true
    initial_enabled: true
    matcher_type: regex
    matcher_status: implemented
    source_standard: Chicago Manual of Style
    source_edition: 18
    source_section: "10.41"
    source_status: official_qanda_verified
    source_role: supporting
    description: Use lowercase a.m. and p.m. with periods in clock times.
    message: Use Chicago-style lowercase a.m. or p.m. with periods.
    suggestion: Change AM or PM to a.m. or p.m.
    positive_examples:
      - "Start the calibration at 5:30 PM."
      - "Run the backup at 7 AM."
      - "The test starts at 9:15\nP.M."
    negative_examples:
      - "Start the calibration at 5:30 p.m."
      - "Run the backup at 7 a.m."
      - "Use the 24-hour time 17:30."
    exception_examples:
      - "The PM field stores the project manager initials."
      - "AM modulation is outside the scope of this manual."
    exceptions: ["non-time acronyms", "24-hour times", "literal UI field names"]
    pilot_batch: 2
    pilot_risk: low

  - rule_key: avoid_ambiguous_noon_midnight_time
    display_name: Avoid ambiguous 12:00 a.m. and 12:00 p.m.
    category: numbers_abbreviations
    severity: suggestion
    enabled: true
    initial_enabled: true
    matcher_type: regex
    matcher_status: implemented
    source_standard: Chicago Manual of Style
    source_edition: 18
    source_section: "9.40-9.41"
    source_status: official_qanda_verified
    source_role: supporting
    description: Use noon or midnight when 12:00 a.m. or 12:00 p.m. could be ambiguous.
    message: Replace ambiguous 12:00 a.m. or 12:00 p.m. with noon or midnight.
    suggestion: Use noon or midnight if that is the intended time.
    positive_examples:
      - "The daily reset occurs at 12:00 AM."
      - "Start the inspection at 12:00 p.m."
      - "The schedule pauses at 12:00\nP.M."
    negative_examples:
      - "The daily reset occurs at midnight."
      - "Start the inspection at noon."
      - "The schedule pauses at 12:30 p.m."
    exception_examples:
      - "The legacy database stores noon as a literal value."
      - "The UI field label is Midnight."
    exceptions: ["literal UI values", "database values that must be reproduced exactly"]
    pilot_batch: 2
    pilot_risk: low

  - rule_key: repeat_ordinal_ending_in_ranges
    display_name: Repeat ordinal endings in ordinal ranges
    category: numbers_abbreviations
    severity: suggestion
    enabled: true
    initial_enabled: true
    matcher_type: regex
    matcher_status: implemented
    source_standard: Chicago Manual of Style
    source_edition: 18
    source_section: "9.6, 9.33, 6.83"
    source_status: official_qanda_verified
    source_role: supporting
    description: In ordinal ranges, repeat the ordinal ending on both numbers.
    message: Repeat the ordinal ending on both numbers in the range.
    suggestion: Write both ordinals in full, such as 24th-25th.
    positive_examples:
      - "Check the 24-25th rows."
      - "Review the 1-2nd pages."
      - "Inspect the 3\n-4th terminals."
    negative_examples:
      - "Check the 24th-25th rows."
      - "Review the 1st-2nd pages."
      - "Inspect terminals 3-4."
    exception_examples:
      - "Use pins 24-25 for the signal pair."
      - "The range 1-2 mm is valid."
    exceptions: ["cardinal number ranges", "pin ranges", "measurements"]
    pilot_batch: 2
    pilot_risk: low

  - rule_key: avoid_apostrophe_for_plural_numbers_and_abbreviations
    display_name: Do not use apostrophes for plural numbers or abbreviations
    category: numbers_abbreviations
    severity: suggestion
    enabled: true
    initial_enabled: true
    matcher_type: regex
    matcher_status: implemented
    source_standard: Chicago Manual of Style
    source_edition: 18
    source_section: "7.15"
    source_status: official_qanda_verified
    source_role: supporting
    description: Form most plurals of capital abbreviations and numerals without an apostrophe.
    message: Remove the apostrophe from this plural abbreviation or numeral.
    suggestion: Use a plain s for the plural form.
    positive_examples:
      - "The folder contains several PDF's."
      - "The log stores the 1990's timestamps as sample data."
      - "Export all ID's\nbefore reset."
    negative_examples:
      - "The folder contains several PDFs."
      - "The log stores the 1990s timestamps as sample data."
      - "Export all IDs before reset."
    exception_examples:
      - "The variable x's value is unavailable."
      - "Use apostrophes for lowercase letter plurals when needed for clarity."
    exceptions: ["lowercase letter plurals", "possessives", "quoted source text"]
    pilot_batch: 2
    pilot_risk: low

  - rule_key: avoid_hyphen_in_or_so_approximation
    display_name: Do not hyphenate or so approximations
    category: hyphenation_terminology
    severity: suggestion
    enabled: true
    initial_enabled: true
    matcher_type: regex
    matcher_status: implemented
    source_standard: Chicago Manual of Style
    source_edition: 18
    source_section: "6.86"
    source_status: official_qanda_verified
    source_role: supporting
    description: Write approximate expressions such as five or so as open words, not as a hyphenated compound.
    message: Remove the hyphens in this or so approximation.
    suggestion: Write the expression as open words.
    positive_examples:
      - "Wait five-or-so minutes before retrying."
      - "The process takes 10-or-so seconds."
      - "Run the pump for two-or-so\ncycles."
    negative_examples:
      - "Wait five or so minutes before retrying."
      - "The process takes 10 or so seconds."
      - "Run the pump for two or so cycles."
    exception_examples:
      - "The product name Five Or So is quoted from the source."
      - "Use the literal tag FIVE_OR_SO in the test fixture."
    exceptions: ["quoted product names", "literal code or data tags"]
    pilot_batch: 2
    pilot_risk: low

  - rule_key: avoid_hyphen_in_and_a_half_measurement
    display_name: Do not hyphenate and a half measurements
    category: hyphenation_terminology
    severity: suggestion
    enabled: true
    initial_enabled: true
    matcher_type: regex
    matcher_status: implemented
    source_standard: Chicago Manual of Style
    source_edition: 18
    source_section: "6.86"
    source_status: official_qanda_verified
    source_role: supporting
    description: In post-noun measurement expressions, write two and a half hours as open words.
    message: Remove the hyphens in this and a half measurement expression.
    suggestion: Write the expression as open words.
    positive_examples:
      - "Wait two-and-a-half hours before startup."
      - "Rotate the knob three-and-a-half turns."
      - "Pause for one-and-a-half\nminutes."
    negative_examples:
      - "Wait two and a half hours before startup."
      - "Rotate the knob three and a half turns."
      - "Pause for one and a half minutes."
    exception_examples:
      - "Use a two-and-a-half-hour interval."
      - "The part name is Two-and-a-Half Bracket."
    exceptions: ["pre-noun compound modifiers", "official product names"]
    pilot_batch: 2
    pilot_risk: low

  - rule_key: avoid_casual_slash_abbreviations
    display_name: Avoid casual slash abbreviations
    category: hyphenation_terminology
    severity: suggestion
    enabled: true
    initial_enabled: true
    matcher_type: regex
    matcher_status: implemented
    source_standard: Chicago Manual of Style
    source_edition: 18
    source_section: "10.3"
    source_status: official_qanda_verified
    source_role: supporting
    description: Avoid informal slash abbreviations such as w/ and w/o in technical manual prose.
    message: Replace this casual slash abbreviation with the full word.
    suggestion: Write with or without.
    positive_examples:
      - "Install the bracket w/ the supplied screws."
      - "Run the test w/o the adapter."
      - "Ship the kit w/\nthe protective cap installed."
    negative_examples:
      - "Install the bracket with the supplied screws."
      - "Run the test without the adapter."
      - "Use input/output for the slash pair."
    exception_examples:
      - "The code sample uses WITH_FLAG exactly as entered."
      - "The legacy UI option is labeled No Adapter."
    exceptions: ["code samples", "literal UI labels", "part numbers"]
    pilot_batch: 2
    pilot_risk: low

  - rule_key: avoid_all_caps_for_emphasis
    display_name: Avoid all caps for emphasis
    category: hyphenation_terminology
    severity: suggestion
    enabled: true
    initial_enabled: true
    matcher_type: controlled_vocabulary
    matcher_status: implemented
    source_standard: Chicago Manual of Style
    source_edition: 18
    source_section: "7.54"
    source_status: official_cmos_verified
    source_role: supporting
    description: Do not use all caps merely for emphasis in running text.
    message: Avoid all caps for emphasis in running text.
    suggestion: Use lowercase wording or rewrite the emphasis.
    positive_examples:
      - "The connector is VERY hot after operation."
      - "IMPORTANT values must be backed up before reset."
      - "NEVER\nremove the cover during operation."
    negative_examples:
      - "The connector is very hot after operation."
      - "Important values must be backed up before reset."
      - "Never remove the cover during operation."
    exception_examples:
      - "CAUTION: HOT SURFACE."
      - "Press the RESET button."
    exceptions: ["caution labels", "literal UI labels", "acronyms and key names"]
    pilot_batch: 2
    pilot_risk: low

  - rule_key: use_chicago_singular_possessive_s
    display_name: Use apostrophe s for singular possessives ending in s
    category: hyphenation_terminology
    severity: suggestion
    enabled: false
    initial_enabled: false
    matcher_type: token
    matcher_status: implemented
    source_standard: Chicago Manual of Style
    source_edition: 18
    source_section: "7.16-7.17"
    source_status: official_qanda_verified
    source_role: supporting
    description: For most singular names ending in s, form the possessive with apostrophe s.
    message: Chicago style normally adds apostrophe s to singular possessives ending in s.
    suggestion: Use apostrophe s for the singular possessive.
    positive_examples:
      - "James' controller is offline."
      - "Harris' procedure appears in the appendix."
      - "Charles'\nmanual is archived."
    negative_examples:
      - "James's controller is offline."
      - "Harris's procedure appears in the appendix."
      - "The modules' ports are labeled."
    exception_examples:
      - "The controllers' settings are synchronized."
      - "The product name is Harris' Legacy Adapter."
    exceptions: ["plural possessives", "official product names", "quoted source text"]
    pilot_batch: 2
    pilot_risk: medium

  - rule_key: use_that_for_restrictive_relative_clauses
    display_name: Use that for restrictive relative clauses
    category: grammar
    severity: suggestion
    enabled: false
    initial_enabled: false
    matcher_type: contextual
    matcher_status: implemented
    source_standard: Chicago Manual of Style
    source_edition: 18
    source_section: "5.250, 6.29"
    source_status: official_qanda_verified
    source_role: supporting
    description: In a restrictive relative clause, prefer that over which and omit commas around the clause.
    message: This restrictive clause may need that instead of which.
    suggestion: Use that for the restrictive clause.
    positive_examples:
      - "Use the module which controls pressure."
      - "Open the file which contains the log."
      - "Select the option which\nstarts calibration."
    negative_examples:
      - "Use the module that controls pressure."
      - "Open the file that contains the log."
      - "Use the module, which controls pressure, only for calibration."
    exception_examples:
      - "Use the module, which controls pressure, only for calibration."
      - "The setting, which is optional, remains disabled."
    exceptions: ["nonrestrictive clauses", "quoted text", "legal or contract text preserving original wording"]
    pilot_batch: 2
    pilot_risk: medium

  - rule_key: avoid_double_negative
    display_name: Avoid double negatives
    category: grammar
    severity: suggestion
    enabled: true
    initial_enabled: true
    matcher_type: regex
    matcher_status: implemented
    source_standard: Chicago Manual of Style
    source_edition: 18
    source_section: "5.243"
    source_status: official_cmos_verified
    source_role: supporting
    description: Avoid using two negative terms when one negative construction expresses the intended meaning.
    message: This sentence may contain a double negative.
    suggestion: Use a single negative construction.
    positive_examples:
      - "Do not press no buttons during startup."
      - "The device cannot detect nothing in standby mode."
      - "Do not remove no\ncovers during operation."
    negative_examples:
      - "Do not press any buttons during startup."
      - "The device cannot detect anything in standby mode."
      - "Remove no covers during operation."
    exception_examples:
      - "No user can disable the no-load test."
      - "The literal string is 'no nothing'."
    exceptions: ["literal strings", "terms where no is part of a fixed technical phrase"]
    pilot_batch: 2
    pilot_risk: low

  - rule_key: keep_neither_nor_parallel
    display_name: Keep neither/nor elements parallel
    category: grammar
    severity: suggestion
    enabled: false
    initial_enabled: false
    matcher_type: contextual
    matcher_status: implemented
    source_standard: Chicago Manual of Style
    source_edition: 18
    source_section: "5.249-5.252"
    source_status: official_qanda_verified
    source_role: supporting
    description: Keep the grammatical elements that follow neither and nor parallel.
    message: The neither/nor construction may not be parallel.
    suggestion: Revise the words after neither and nor so they use the same grammatical form.
    positive_examples:
      - "The system neither records the signal nor the warning appears."
      - "The tool neither opens the file nor the log loads."
      - "The app neither checks the file\nnor the status appears."
    negative_examples:
      - "The system records neither the signal nor the warning."
      - "The tool neither opens the file nor loads the log."
      - "The app checks neither the file nor the status."
    exception_examples:
      - "Neither the signal nor the warning appears."
      - "Neither module nor controller is installed."
    exceptions: ["valid subject coordination", "intentionally repeated complete clauses"]
    pilot_batch: 2
    pilot_risk: medium

  - rule_key: keep_auxiliary_verb_forms_parallel
    display_name: Keep auxiliary verb forms parallel in a series
    category: grammar
    severity: suggestion
    enabled: false
    initial_enabled: false
    matcher_type: contextual
    matcher_status: implemented
    source_standard: Chicago Manual of Style
    source_edition: 18
    source_section: "5.249-5.252"
    source_status: official_qanda_verified
    source_role: supporting
    description: In a coordinated series, make the shared auxiliary or verb pattern apply cleanly to each item.
    message: The verb forms in this series may not be parallel.
    suggestion: Use parallel verb forms in the series.
    positive_examples:
      - "The system starts the scan, records data, and is displaying the result."
      - "The app checks the file, saves the log, and is opening the report."
      - "The controller loads the profile,\nchecks the sensor, and is storing the result."
    negative_examples:
      - "The system starts the scan, records data, and displays the result."
      - "The app checks the file, saves the log, and opens the report."
      - "The controller loads the profile, checks the sensor, and stores the result."
    exception_examples:
      - "The system is starting the scan, recording data, and displaying the result."
      - "The app checks the file, saves the log, and is ready."
    exceptions: ["progressive series with shared auxiliary", "predicate adjective after and"]
    pilot_batch: 2
    pilot_risk: medium

  - rule_key: use_singular_verb_after_one_in_ratio
    display_name: Use a singular verb after one in ratio subjects
    category: grammar
    severity: suggestion
    enabled: true
    initial_enabled: true
    matcher_type: token
    matcher_status: implemented
    source_standard: Chicago Manual of Style
    source_edition: 18
    source_section: "5.145-5.147"
    source_status: official_qanda_verified
    source_role: supporting
    description: When one in a ratio is the grammatical subject, use a singular verb.
    message: The one in ratio subject normally takes a singular verb.
    suggestion: Change have to has when one is the subject.
    positive_examples:
      - "Only 1 in 8 modules have failed."
      - "Approximately 1 in 12 sensors have drifted."
      - "About 1 in 5 controllers\nhave a warning."
    negative_examples:
      - "Only 1 in 8 modules has failed."
      - "Approximately 1 in 12 sensors has drifted."
      - "About 2 in 5 controllers have a warning."
    exception_examples:
      - "The report quotes a plural-verb survey sentence."
      - "The table cell contains the label ratio status."
    exceptions: ["quoted source text", "table cells", "statistical labels"]
    pilot_batch: 2
    pilot_risk: low
