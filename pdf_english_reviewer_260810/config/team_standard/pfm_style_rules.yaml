# =============================================================================
# PFM Manual Style & Grammar Rules
# =============================================================================
# Chapter01 Introduction 원본 vs 수정본 비교 분석에서 추출한 규칙 세트.
# 검토 MVP 프로그램(regex/keyword 기반 linter)이 소비하도록 설계.
#
# 규칙 카테고리:
#   - grammar             : 문법 오류
#   - diction             : 어휘·목적어 선택
#   - order               : 문장 순서·프레이밍
#   - style               : 문체·톤·hedging
#   - structure           : 절/문단 구조
#   - technical_accuracy  : 물리·기술적 정확성
#
# Severity:
#   - error   : 반드시 수정 (비문, 물리적 오류)
#   - warning : 강력 권장 수정 (일관성·명료성)
#   - info    : 개선 제안 (스타일)
# =============================================================================

meta:
  name: "PFM Manual Style Guide"
  version: "1.0.0"
  target_document_type: "Park Systems AFM Mode Manual"
  source_analysis: "style_analysis_Chapter01_Introduction_Piezoelectric.pdf"
  language: "en"
  created: "2026-08-11"
  author: "kate.park@parksystems.com"

# -----------------------------------------------------------------------------
# 카테고리 정의
# -----------------------------------------------------------------------------
categories:
  - id: grammar
    label_ko: "문법"
  - id: diction
    label_ko: "어휘 / 목적어 선택"
  - id: order
    label_ko: "문장 순서 / 프레이밍"
  - id: style
    label_ko: "문체 / 톤"
  - id: structure
    label_ko: "절·문단 구조"
  - id: technical_accuracy
    label_ko: "물리·기술 정확성"

# -----------------------------------------------------------------------------
# 규칙 세트
# -----------------------------------------------------------------------------
rules:

  # ===========================================================================
  # GRAMMAR (문법 오류)
  # ===========================================================================

  - id: G001
    name: "to-부정사 목적어 중복"
    category: grammar
    severity: error
    description_ko: |
      "S is/are + adj + to V + it/them" 구조에서 S와 뒤의 it/them이 같은 대상을 지시할 때 발생하는 비문.
      예: "The signal is more appropriate to interpret it as ..."
    description_en: |
      Sentence pattern "S + be + adj + to V + it/them" where the object pronoun refers back to the subject.
    detect:
      type: regex
      flags: "i"
      patterns:
        - '\b(the\s+\w+(\s+\w+)?)\s+is\s+(more\s+)?(appropriate|reasonable|difficult|easy|possible)\s+to\s+\w+\s+(it|them)\b'
        - '\bit\s+is\s+(more\s+)?(appropriate|reasonable|difficult|easy|possible)\s+to\s+\w+\s+(it|them)\b'
    fix_suggestion: |
      두 가지 방법:
      (a) 수동태: "S should be interpreted as ..."
      (b) 형식주어 + 명시적 목적어: "It is more appropriate to interpret S as ..."
    bad_examples:
      - "The signal measured in PFM is more appropriate to interpret it as a localized effective response."
    good_examples:
      - "The PFM signal should be interpreted as an effective local electromechanical response."
      - "It is more appropriate to interpret the PFM signal as an effective local response."
    rationale: "주어와 to-부정사의 목적어가 중복되어 비문. 반드시 재작성."

  - id: G002
    name: "부정문 + Instead 대조 → Unlike/Whereas 권장"
    category: grammar
    severity: warning
    description_ko: |
      "X do not exhibit ... Instead, they exhibit Y" 구조는 독자가 부정 대상을 먼저 상상 후 뒤집어야 하므로
      인지 부하가 크다. "Unlike A, B ..." 또는 "Whereas A, B ..." 패턴으로 압축 권장.
    detect:
      type: regex
      flags: "is"
      patterns:
        - '\bdo(es)?\s+not\s+exhibit\b[^.]*\.\s*Instead,'
        - '\b(is|are)\s+not\s+\w+[^.]*\.\s*Instead,'
    fix_suggestion: |
      Unlike + 비교 대상 + 주어 + 동사 패턴으로 재작성:
      "Unlike ordinary piezoelectric materials, ferroelectric materials exhibit hysteresis ..."
    bad_examples:
      - "Ferroelectric materials do not exhibit an immediately reversible linear response. Instead, they exhibit hysteresis behavior."
    good_examples:
      - "Unlike ordinary piezoelectric materials, ferroelectric materials exhibit hysteresis in response to changes in the applied electric field."
    rationale: "부정 + 역접보다 직접 대조가 정보 밀도·명료성에서 우수."

  - id: G003
    name: "관사 오류 — 'a AFM' / 'a MFM' / 'a UHV'"
    category: grammar
    severity: error
    description_ko: |
      자음 발음이 아닌 모음 발음으로 시작하는 두문자어(AFM, MFM, UHV, EFM 등) 앞에는 "an"이 와야 한다.
      원본 두 문서 모두 "a AFM"로 잘못 표기.
    detect:
      type: regex
      flags: ""
      patterns:
        - '\ba\s+(AFM|MFM|EFM|UHV|SEM|STM|XPS|AC|IR|UV|OR|CR|OR-PFM|CR-PFM)\b'
    fix_suggestion: '"a AFM" → "an AFM". 모음으로 시작하는 두문자어 앞에는 an 사용.'
    bad_examples:
      - "PFM is a AFM-based measurement technique ..."
      - "PFM is a AFM mode ..."
    good_examples:
      - "PFM is an AFM-based measurement technique ..."
    rationale: "발음 기준 관사 규칙. 원본과 수정본 모두 놓친 오류."

  # ===========================================================================
  # ORDER (문장 순서 / 프레이밍)
  # ===========================================================================

  - id: O001
    name: "관찰 서술 문장에 측정 상황 프레이밍 부재"
    category: order
    severity: warning
    description_ko: |
      관찰·측정 결과를 서술하는 문장은 "측정 상황"을 부사구로 문두에 두어야 한다.
      Kate 원본의 반복 문제: 재료·물리량 명사로 바로 시작하여 어떤 측정 조건인지 뒤늦게 파악.
    description_en: |
      Sentences describing measured behaviors must open with a context-setting adverbial phrase
      (e.g., "During PFM spectroscopy,", "Under off-resonance conditions,", "In vertical PFM,").
    detect:
      type: regex
      flags: "im"
      patterns:
        # 문장 시작이 관사+명사인데 앞에 프레이밍 부사구가 없는 관찰 서술
        - '^(The|A|An)\s+(amplitude|phase|response|signal|displacement|deformation|piezoresponse)[^.]*\b(exhibits?|shows?|reflects?|represents?|indicates?|reveals?)\b'
    fix_suggestion: |
      문두에 측정 상황·조건 부사구 추가:
      "During PFM spectroscopy, ...", "Under off-resonance conditions, ...", "In vertical PFM, ...",
      "In CR-PFM measurements, ...", "At the coercive bias, ..."
    bad_examples:
      - "The amplitude–voltage response of ferroelectric materials commonly exhibits a butterfly-shaped loop."
    good_examples:
      - "During PFM spectroscopy, the measured amplitude as a function of the applied voltage commonly exhibits a butterfly-shaped loop."
    rationale: |
      매뉴얼은 "측정자 관점"이 원칙. 관찰된 현상은 재료의 고유 특성이 아니라
      "특정 측정 상황에서 나온 결과"임을 문두에 각인시켜야 한다.
    priority: high  # Kate의 반복 패턴 1순위

  - id: O002
    name: "비교/대조 절 서두에 비교 축(axis) 부재"
    category: order
    severity: warning
    description_ko: |
      "Comparative" 성격의 절(A vs B)이 시작될 때 첫 문장은 즉시 "비교 축"을 선언해야 한다.
      Chapter 도입부의 재정의로 시작하면 독자가 표를 어떤 기준으로 읽을지 알 수 없다.
    detect:
      type: heuristic
      trigger_headings:
        - "Comparative Characteristics"
        - "Comparison of"
        - "Selecting"
        - "Mode Selection"
      check:
        - "first_sentence_contains_comparison_axis"  # "differ in", "Although X ... Y differ in", "Unlike"
    fix_suggestion: |
      절 첫 문장 패턴:
      "Although X and Y share Z, they differ in W."
      "X and Y differ primarily in [axis], which determines [consequences]."
    bad_examples:
      - "PFM is a local electromechanical characterization technique based on AFM; however, its operational implementation is not limited to a single configuration. Depending on the measurement purpose ..."
    good_examples:
      - "Although OR-PFM and CR-PFM are based on the same electromechanical signal detection principle, they differ in the selection of the excitation frequency relative to the cantilever–sample contact resonance."
    rationale: "비교 절은 축이 먼저 나와야 표·본문 모두 그 축으로 정렬된다."

  - id: O003
    name: "문단 순서 — 대조가 성립하려면 대조 대상이 인접해야 함"
    category: order
    severity: info
    description_ko: |
      "In contrast, ..." 문장은 앞 문단이 대조 대상이어야 성립. Kate 원본은 재료 정의(piezo)와
      측정 방법 문단이 뒤섞여 "In contrast, in PFM ..." 문장의 대조 대상이 즉시 앞에 없다.
    detect:
      type: heuristic
      patterns:
        - 'sentence_starts_with: "In contrast," AND previous_paragraph_topic != contrast_target'
    fix_suggestion: |
      "In contrast, in PFM ..." 앞 문단은 반드시 "conventional characterization" 내용이어야 함.
      문단 순서를 스왑하거나 접속 문구를 조정.
    rationale: "대조 구문은 인접 문단의 논리적 연결이 전제."

  # ===========================================================================
  # DICTION (어휘 / 목적어 선택)
  # ===========================================================================

  - id: D001
    name: "'AFM mode' 대신 'AFM-based measurement technique' 사용"
    category: diction
    severity: warning
    description_ko: |
      Chapter 최상위 정의에서 PFM을 "AFM mode"로 좁게 분류하면 하위 mode(OR-PFM, CR-PFM)
      계층 구조가 무너진다. 상위 계층은 "technique"로 정의.
    detect:
      type: regex
      flags: ""
      patterns:
        - '\bPFM\s+is\s+an?\s+AFM\s+mode\b'
        - '\b(EFM|MFM|KPFM)\s+is\s+an?\s+AFM\s+mode\b'
    fix_suggestion: '"AFM mode" → "AFM-based measurement technique". Chapter 도입부 한정.'
    bad_examples:
      - "PFM is a AFM mode that applies an electric field to a sample ..."
    good_examples:
      - "PFM is an AFM-based measurement technique that applies an electric field to a sample ..."
    rationale: "매뉴얼 계층 구조: technique > mode(OR/CR) > operating condition."
    scope: chapter_introduction_only

  - id: D002
    name: "과도하게 특정된 목적어 광역화"
    category: diction
    severity: warning
    description_ko: |
      좁은 물리량이 상위 개념 자리에서 사용될 때. 매뉴얼 도입부의 일반 서술에서
      "displacement magnitude", "switching history", "local switching behavior" 등은
      상위 개념(electromechanical response, polarization switching)으로 광역화.
    detect:
      type: keyword_list
      match_words:
        - "displacement magnitude"
        - "switching history"
        - "local switching behavior"
      replace_suggestions:
        "displacement magnitude": "electromechanical response"
        "switching history": "switching behavior of individual domains"
        "local switching behavior": "polarization switching"
    fix_suggestion: "위 replace_suggestions 참조. 도입부·개론 성격 절에서만 적용."
    bad_examples:
      - "... contain information not only about displacement magnitude but also about polarization orientation and switching history."
    good_examples:
      - "... contain information not only about local electromechanical response but also about polarization orientation and switching behavior of individual domains."
    rationale: "과잉 특정(over-specification)을 피하고 챕터 도입부의 일반화 톤 유지."

  - id: D003
    name: "'inverse piezoelectric deformation' → 'electrically induced surface deformation'"
    category: diction
    severity: info
    description_ko: |
      PFM 검출 원리 서술에서 시료의 종류를 특정하지 않는 편이 일반적.
      "inverse piezoelectric"은 재료가 piezoelectric일 때만 성립.
    detect:
      type: regex
      flags: "i"
      patterns:
        - '\bresulting\s+inverse\s+piezoelectric\s+deformation\b'
    fix_suggestion: '"resulting inverse piezoelectric deformation" → "resulting electrically induced surface deformation"'
    scope: pfm_detection_principle_paragraphs
    rationale: "원인(전기장)-결과(변형) 표현으로 재료 특정 회피."

  - id: D004
    name: "'may contain domains' → 'may consist of domains'"
    category: diction
    severity: info
    description_ko: |
      Ferroelectric 재료의 도메인 구조를 전체적으로 서술할 때 "consist of" 사용.
      "contain"은 부분 소유(도메인 없는 영역이 공존 가능)의 뉘앙스.
    detect:
      type: regex
      flags: "i"
      patterns:
        - '\bmaterials?\s+may\s+contain\s+domains\b'
    fix_suggestion: '"may contain domains" → "may consist of domains"'
    rationale: "재료가 도메인의 집합체임을 전체-부분 관계로 표현."

  # ===========================================================================
  # STYLE (문체 / 톤 / hedging)
  # ===========================================================================

  - id: S001
    name: "한 문장 hedging 중복"
    category: style
    severity: warning
    description_ko: |
      "relatively small", "generally most directly", "may possibly", "tends to typically" 등
      hedge 표현이 한 문장 안에 2개 이상 겹치면 주장의 신뢰도가 저하된다.
      문장당 hedge 1개 이내 원칙.
    detect:
      type: heuristic
      hedge_words:
        - "relatively"
        - "generally"
        - "typically"
        - "may"
        - "might"
        - "tends to"
        - "somewhat"
        - "possibly"
        - "probably"
        - "usually"
        - "often"
        - "commonly"
      threshold_per_sentence: 2  # 2개 이상이면 경고
    fix_suggestion: |
      가장 약한 hedge 하나만 남기고 나머지 제거. 예:
      "relatively small" → "small" 또는 "minimized"
      "generally most directly" → "most directly"
      "may typically" → "typically"
    bad_examples:
      - "The dynamic amplification effect of the cantilever is relatively small."
      - "Vertical PFM is generally most directly related to the d33 coefficient."
    good_examples:
      - "The dynamic amplification of the cantilever is minimized."
      - "Vertical PFM is most directly associated with the d33 coefficient."
    rationale: "공학 매뉴얼에서 이중 hedge는 주장의 신뢰도를 저하시킴."

  - id: S002
    name: "요인 3개 이상 나열 시 범주 그룹핑 필요"
    category: style
    severity: info
    description_ko: |
      3개 이상의 요인을 병렬 나열할 때 층위가 다른 요인(장비/시료/환경/조건)이 뒤섞이면
      독자가 스스로 분류해야 함. "instrumental factors such as ... , sample-related factors such as ..."
      패턴으로 그룹핑.
    detect:
      type: heuristic
      trigger:
        - "3+ items in comma list following 'such as' or 'including' or 'factors such as'"
        - "items span multiple categories (instrumental, sample, environmental, contact)"
    fix_suggestion: |
      범주별 그룹핑:
      "Cross-talk between the two channels may arise from instrumental factors, such as
       cantilever alignment and optical detector alignment, as well as sample-related factors
       including anisotropic deformation, tip orientation, and contact conditions."
    bad_examples:
      - "Depending on factors such as cantilever alignment, sample anisotropy, tip orientation, and contact conditions, cross-talk may occur."
    good_examples:
      - "Cross-talk may arise from instrumental factors, such as cantilever alignment and optical detector alignment, as well as sample-related factors including anisotropic deformation, tip orientation, and contact conditions."
    rationale: "층위가 다른 요인은 반드시 범주 라벨링 후 예시."

  - id: S003
    name: "'change sign' — amplitude에는 부적절"
    category: style
    severity: error
    description_ko: |
      Amplitude(크기)는 항상 비음수이므로 "change sign" 표현은 사용 불가.
      Phase가 flip 되는 것이지 amplitude가 sign을 바꾸는 것이 아님.
    detect:
      type: regex
      flags: "i"
      patterns:
        - '\bamplitude\b[^.]*\bchange\s+sign\b'
        - '\bchange\s+sign\b[^.]*\bamplitude\b'
        - '\bpiezoresponse\b[^.]*\bchange\s+sign\b'  # piezoresponse가 amplitude 문맥일 때
    fix_suggestion: |
      "change sign" 삭제 후 "decrease significantly" 또는 "reach a minimum" 사용.
      Phase flip을 강조하고 싶다면 별도 문장으로 "the phase response flips by 180°".
    bad_examples:
      - "... causing the effective piezoresponse to temporarily decrease or change sign during the switching process."
    good_examples:
      - "... causing the effective piezoresponse to decrease significantly during the polarization switching process."
    rationale: "물리적 정확성. Amplitude 정의상 sign 변화 불가."

  # ===========================================================================
  # STRUCTURE (절·문단 구조)
  # ===========================================================================

  - id: T001
    name: "소절 간 bridge sentence 부재"
    category: structure
    severity: info
    description_ko: |
      한 subsection이 끝날 때 다음 subsection으로의 연결 문장이 없으면 흐름이 끊긴다.
      마지막 문장에 "which is described in the following section" 유형의 다리 추가.
    detect:
      type: heuristic
      check: "last_paragraph_before_next_subheading_has_transition_phrase"
      transition_phrases:
        - "described in the following section"
        - "detailed in Section"
        - "discussed next"
        - "presented below"
        - "as shown in the next"
    fix_suggestion: |
      Subsection 마지막 문장 예:
      "..., which is described in the following section."
      "The corresponding [X] is presented in the next subsection."
    rationale: "매뉴얼 구조에서 subsection bridge는 독자 흐름 유지의 필수 요소."

  - id: T002
    name: "절 서두에서 이전 챕터 내용 반복 서술"
    category: structure
    severity: warning
    description_ko: |
      절이 시작될 때 Chapter 도입부에서 이미 언급한 내용(PFM 정의 등)을 재서술하지 말 것.
      절 첫 문장은 그 절이 다룰 논점을 즉시 선언.
    detect:
      type: heuristic
      trigger:
        - "section opening paragraph contains general PFM definition already stated in chapter intro"
        - "phrases: 'PFM is a ... technique', 'PFM is a local ... characterization' at section (not chapter) level"
    fix_suggestion: "절 서두에서 재정의 대신 논점 선언. 예: 'Although X and Y ..., they differ in ...'"
    rationale: "매뉴얼에서 절 도입부 loop는 정보 밀도 저하."

  - id: T003
    name: "문단 = 하나의 논점 원칙"
    category: structure
    severity: info
    description_ko: |
      한 문단이 여러 논점(정의 + 이점 + 해석 주의)을 섞으면 독자가 논지를 놓친다.
      문단 하나에 논점 하나(one paragraph = one idea).
    detect:
      type: heuristic
      check: "paragraph_topic_sentence_count > 1"
    fix_suggestion: "논점 단위로 문단 분리. CR-PFM 절 참고: 정의 / 이점 / 해석 주의 / 실험 조건 / 비교."
    rationale: "매뉴얼 가독성의 기본."

  - id: T004
    name: "중복 절 통합 (Mode Selection Guidance ↔ Comparative Characteristics)"
    category: structure
    severity: info
    description_ko: |
      "Mode Selection Guidance"와 "Comparative Characteristics" 절이 다루는 내용이
      Table 1.1을 중심으로 크게 겹치면 하나의 절로 통합. 표 앞 문장이 도입, 표 뒤 문장이 결론.
    detect:
      type: heuristic
      trigger: "adjacent sections with overlapping tables/topics"
    fix_suggestion: "Mode Selection Guidance 절 삭제 후 Comparative Characteristics 절 안으로 Table + 요약 문단 통합."
    rationale: "매뉴얼 목차 정리 관점."

  # ===========================================================================
  # TECHNICAL_ACCURACY (물리·기술 정확성)
  # ===========================================================================

  - id: A001
    name: "Lateral PFM tensor components — d31, d32 대신 d15, d24"
    category: technical_accuracy
    severity: error
    description_ko: |
      Lateral PFM은 cantilever의 비틀림(torsion) 감지 → shear 성분(d15, d24)이 주요 기여.
      d31, d32는 수직 전기장 → 면내 변형으로 vertical channel에 영향을 주는 성분.
    detect:
      type: regex
      flags: "is"
      patterns:
        - '\blateral\s+PFM\b[^.]*\bd[_\s]*31\b'
        - '\blateral\s+PFM\b[^.]*\bd[_\s]*32\b'
        - '\btorsion\b[^.]*\bd[_\s]*31\b'
    fix_suggestion: |
      "d15, d31, d32" → "d15, d24" 로 교정.
      Lateral(shear) 채널에서는 shear-mode 계수(d15, d24)로 좁힐 것.
    bad_examples:
      - "Lateral PFM is typically associated with piezoelectric tensor components such as d15, d31, or d32."
    good_examples:
      - "Lateral PFM is typically associated with shear-related piezoelectric tensor components, such as d15, d24, and other in-plane piezoelectric coefficients."
    rationale: "물리적 정확성 — cantilever torsion은 shear 응답 감지."

  - id: A002
    name: "PFM 정의에서 'that applies' 주체는 tip, not mode"
    category: technical_accuracy
    severity: info
    description_ko: |
      "PFM is an AFM-based ... technique that applies an electric field to a sample" 문장에서
      실제 전기장을 인가하는 주체는 conductive tip. 도입부 개론이라면 허용되지만,
      상세 절에서는 "the conductive tip applies ..."로 명시하는 편이 정확.
    detect:
      type: regex
      flags: "i"
      patterns:
        - '\bPFM\s+(is\s+an?\s+\w+[\s\w]*technique\s+)?that\s+applies\s+an\s+electric\s+field\b'
    fix_suggestion: "상세 절에서는 'a conductive AFM tip applies an AC voltage to the sample surface' 형태로 명시."
    scope: detailed_sections_only  # Chapter 도입부는 허용
    rationale: "행위 주체 명료화."

  # ===========================================================================
  # 확장 예약 슬롯
  # ===========================================================================

  # 향후 챕터별 규칙 추가 시 아래 형식 유지:
  # - id: <PREFIX><NUMBER>
  #   name: ...
  #   category: ...
  #   severity: ...
  #   description_ko: ...
  #   detect: ...
  #   fix_suggestion: ...
  #   bad_examples: [...]
  #   good_examples: [...]
  #   rationale: ...

# -----------------------------------------------------------------------------
# 검출 방식 (detect.type) 정의 — MVP 구현 가이드
# -----------------------------------------------------------------------------
detect_types:
  regex:
    description: "정규표현식 매칭. flags 지원 (i=대소문자무시, m=multiline, s=dotall)."
    engine: "python re module"

  keyword:
    description: "단순 단어 매칭. word boundary 자동 적용."

  keyword_list:
    description: |
      match_words 리스트의 각 단어를 검출.
      replace_suggestions 딕셔너리로 각 단어별 권장 대체 표현 제공.

  heuristic:
    description: |
      다중 조건 조합 (trigger + check). MVP에서는 다음 항목 지원 권장:
      - sentence_hedge_count > N
      - sentence_starts_with_pattern
      - paragraph_topic_sentence_count > N
      - last_paragraph_before_next_subheading_has_transition_phrase
      - first_sentence_contains_comparison_axis
      - 3+ items in comma list

