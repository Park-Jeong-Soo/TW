<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AFM Journal Search Tool</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    padding: 24px;
  }
  .card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 16px;
    padding: 48px 56px;
    max-width: 520px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .back {
    display: inline-block;
    margin-bottom: 16px;
    font-size: 12px;
    opacity: 0.7;
    color: #fff;
    text-decoration: none;
  }
  .back:hover { opacity: 1; }
  h1 { font-size: 28px; margin-bottom: 8px; font-weight: 700; }
  p.subtitle { font-size: 15px; opacity: 0.85; margin-bottom: 32px; }
  .links { display: flex; flex-direction: column; gap: 12px; }
  a.btn {
    display: block;
    padding: 16px 24px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 10px;
    color: #fff;
    text-decoration: none;
    font-size: 16px;
    font-weight: 500;
    transition: all 0.2s ease;
  }
  a.btn:hover {
    background: rgba(255,255,255,0.25);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  }
  a.btn .lang { font-size: 12px; opacity: 0.7; margin-left: 8px; }
</style>
</head>
<body>
  <div class="card">
    <a class="back" href="../">&larr; Back to TW</a>
    <h1>AFM Journal Search Tool</h1>
    <p class="subtitle">Park Systems &middot; AI Club</p>
    <div class="links">
      <a class="btn" href="ko.html">한국어로 열기 <span class="lang">KO</span></a>
      <a class="btn" href="en.html">Open in English <span class="lang">EN</span></a>
    </div>
  </div>
</body>
</html>
